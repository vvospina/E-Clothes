version: '3.8'

services:
  prendas-servicio:
    build:
      context: .
      dockerfile: Dockerfile
    image: prendas-servicio:v1.0
    container_name: prendas_microservice
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s